name: Build Snake APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Init Capacitor
        run: |
          mkdir -p www
          cp index.html www/

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "Snake IO" "com.snakeio.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Create Gradle Build Configuration
        run: |
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext {
                  kotlinVersion = '1.8.22'
              }
          
              repositories {
                  google()
                  mavenCentral()
              }
          
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.kotlinVersion"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$rootProject.kotlinVersion"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$rootProject.kotlinVersion"
                  }
              }
          }
          EOF

      - name: Create App Gradle Configuration
        run: |
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          
          android {
              namespace 'com.snakeio.app'
              compileSdk 34
          
              defaultConfig {
                  applicationId 'com.snakeio.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      debuggable true
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          
              kotlinOptions {
                  jvmTarget = '11'
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.google.android.material:material:1.11.0'
          
              // Capacitor dependencies
              implementation 'com.getcapacitor:core:5.5.1'
              implementation 'com.getcapacitor:android:5.5.1'
          
              // Kotlin
              implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlinVersion}"
          }
          
          configurations.all {
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlinVersion}"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.kotlinVersion}"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${rootProject.kotlinVersion}"
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel --max-workers 4

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SnakeIO-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

      - name: Upload Build Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build-Failure-Report
          path: android/build/reports/
          retention-days: 7
